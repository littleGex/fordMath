name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Publishes by pushing the built site to the gh-pages branch, which GitHub Pages serves
# (Settings → Pages → Source: "Deploy from a branch", branch gh-pages, folder / (root)).
# This replaced actions/deploy-pages, which kept stalling at "updating_pages" on GitHub's side.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs every test and saves the results for the Tests page; fails the job (and blocks publishing) if any test fails
      - run: npm run test:report
      - run: npm run build

      - name: Publish dist/ to the gh-pages branch
        if: github.ref == 'refs/heads/main'
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll   # serve files as they are; don't run Jekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published ${GITHUB_SHA::7} to gh-pages"
