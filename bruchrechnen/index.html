<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141c2e">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="fordMath">
<title>Bruchrechnen · fordMath</title>
</head>
<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>➗ <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="panel calc-panel">
    <p class="note" data-t="hint"></p>
    <div class="task">
      <input id="a" type="text" autocomplete="off" inputmode="text" aria-label="a">
      <div class="ops" role="group">
        <button class="chip" type="button" data-op="+">+</button>
        <button class="chip" type="button" data-op="-">−</button>
        <button class="chip" type="button" data-op="*">·</button>
        <button class="chip" type="button" data-op=":" id="op-div">:</button>
      </div>
      <input id="b" type="text" autocomplete="off" inputmode="text" aria-label="b">
    </div>
    <p class="error" id="error" hidden></p>
    <div class="result" id="result" aria-live="polite"></div>
    <figure class="pic" id="pic-fig"><svg id="pic"></svg><figcaption class="note" id="pic-note"></figcaption></figure>
    <ol class="steps" id="steps"></ol>
  </section>
  <div class="chips" id="examples"></div>

  <h2 class="section" data-t="quizTitle"></h2>
  <section class="panel quiz-panel" id="quiz"></section>

  <p class="version"><a href="https://github.com/littleGex/fordMath/blob/main/src/lib/fraction-calc.ts">Source</a></p>
</main>
<script type="module" src="/src/pages/bruchrechnen.ts"></script>
</body>
</html>
