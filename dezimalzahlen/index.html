<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141c2e">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="fordMath">
<title>Dezimalzahlen · fordMath</title>
</head>
<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>🔸 <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="panel number-panel">
    <label for="num" data-t="numberLabel"></label>
    <input id="num" class="big-input" type="text" inputmode="decimal" autocomplete="off" value="3,472">
    <p class="error" id="num-error" hidden></p>
    <div class="pv-wrap"><table class="pv" id="pv"></table></div>
    <p class="pv-words" id="pv-words"></p>
    <p class="note mono" id="pv-fractions"></p>
  </section>
  <div class="chips" id="examples"></div>

  <h2 class="section" data-t="lineTitle"></h2>
  <figure class="panel line-panel">
    <svg id="line" role="img"></svg>
    <figcaption class="line-tools">
      <button class="chip" type="button" id="zoom-out" data-t="zoomOut"></button>
      <button class="chip" type="button" id="zoom-in" data-t="zoomIn"></button>
      <span class="note" id="line-note"></span>
    </figcaption>
  </figure>

  <h2 class="section" data-t="roundTitle"></h2>
  <div class="panel">
    <div class="chips round-chips" id="round-chips"></div>
    <ol class="steps" id="round-steps"></ol>
  </div>

  <h2 class="section" data-t="compareTitle"></h2>
  <section class="panel two-panel">
    <div class="two-inputs">
      <input id="cmp-a" type="text" inputmode="decimal" autocomplete="off" value="0,5" aria-label="1">
      <span class="cmp-sign" id="cmp-sign">?</span>
      <input id="cmp-b" type="text" inputmode="decimal" autocomplete="off" value="0,45" aria-label="2">
    </div>
    <ol class="steps" id="cmp-steps"></ol>
  </section>

  <h2 class="section" data-t="sumTitle"></h2>
  <section class="panel two-panel">
    <div class="two-inputs">
      <input id="sum-a" type="text" inputmode="decimal" autocomplete="off" value="2,5" aria-label="1">
      <div class="chips op-chips" role="group">
        <button class="chip" type="button" data-op="+" aria-pressed="true">+</button>
        <button class="chip" type="button" data-op="−" aria-pressed="false">−</button>
      </div>
      <input id="sum-b" type="text" inputmode="decimal" autocomplete="off" value="0,75" aria-label="2">
    </div>
    <div class="column-wrap"><div class="columns" id="columns"></div></div>
    <ol class="steps" id="sum-steps"></ol>
    <p class="error" id="sum-error" hidden></p>
  </section>

  <h2 class="section" data-t="quizTitle"></h2>
  <section class="panel quiz-panel" id="quiz"></section>

  <p class="version"><a href="../tests/">Tests</a> · <a href="https://github.com/littleGex/fordMath/blob/main/src/lib/decimal.ts">Source</a></p>
</main>
<script type="module" src="/src/pages/dezimalzahlen.ts"></script>
</body>
</html>
