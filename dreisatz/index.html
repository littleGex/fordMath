<main class="narrow">

      <h1>🛒 <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="chips" id="stories"></div>
  <section class="panel ds-panel">
    <div class="kinds" role="group">
      <button class="chip" type="button" data-kind="proportional"></button>
      <button class="chip" type="button" data-kind="inverse"></button>
    </div>
    <p class="story" id="story"></p>
    <div class="ds-inputs">
      <input id="a" type="text" inputmode="decimal" autocomplete="off" aria-label="a"><span class="unit" id="ux1"></span>
      <span class="eq">≙</span>
      <input id="b" type="text" inputmode="decimal" autocomplete="off" aria-label="b"><span class="unit" id="uy1"></span>
      <input id="c" type="text" inputmode="decimal" autocomplete="off" aria-label="c"><span class="unit" id="ux2"></span>
      <span class="eq">≙</span>
      <span class="ask">?</span><span class="unit" id="uy2"></span>
    </div>
    <p class="error" id="error" hidden></p>
    <div class="ds-lines" id="lines"></div>
    <p class="note" id="why"></p>
  </section>

  <h2 class="section" data-t="checkTitle"></h2>
  <div class="chips" id="tables"></div>
  <section class="panel check-panel">
    <p class="note" data-t="checkHint"></p>
    <div class="ztable-wrap"><table class="ztable" id="check"></table></div>
    <p class="verdict" id="verdict"></p>
    <p class="note" id="verdict-why"></p>
    <figure class="graph-fig"><svg id="graph" role="img"></svg></figure>
