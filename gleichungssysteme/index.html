<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141c2e">
<link rel="icon" type="image/svg+xml" href="/fordMath/favicon.svg">
<link rel="apple-touch-icon" href="/fordMath/icons/apple-touch-icon.png">
<link rel="manifest" href="/fordMath/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="fordMath">
<title>Gleichungssysteme · fordMath</title>
  <script type="module" crossorigin src="/fordMath/assets/gleichungssysteme-EH5ALXd7.js"></script>
  <link rel="modulepreload" crossorigin href="/fordMath/assets/zone-2S0LliKN.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/random-BYFHwryz.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/rational-rTKY84ys.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/linear-system-nWh00aDE.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/lang-dy_RFBaf.js">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/zone-DujYQsVA.css">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/gleichungssysteme-BPXGE88u.css">
</head>
<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>⚖️ <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="panel system" aria-labelledby="system-label">
    <p class="note" id="system-label" data-t="boxes"></p>
    <div class="eq-row" data-row="1">
      <span class="eq-tag">(I)</span>
      <input type="text" inputmode="text" autocomplete="off" data-box="a" aria-label="(I) x">
      <span class="var">x +</span>
      <input type="text" inputmode="text" autocomplete="off" data-box="b" aria-label="(I) y">
      <span class="var">y =</span>
      <input type="text" inputmode="text" autocomplete="off" data-box="c" aria-label="(I) =">
    </div>
    <div class="eq-row" data-row="2">
      <span class="eq-tag">(II)</span>
      <input type="text" inputmode="text" autocomplete="off" data-box="a" aria-label="(II) x">
      <span class="var">x +</span>
      <input type="text" inputmode="text" autocomplete="off" data-box="b" aria-label="(II) y">
      <span class="var">y =</span>
      <input type="text" inputmode="text" autocomplete="off" data-box="c" aria-label="(II) =">
    </div>
    <p class="note" data-t="hint"></p>
    <p class="error" id="error" hidden></p>
  </section>

  <div class="chips" id="examples" role="group" aria-label="Beispiele"></div>

  <section id="answer">
    <div class="panel solution" id="solution">
      <p class="sol-set" id="sol-set"></p>
      <p class="sol-say" id="sol-say"></p>
    </div>
    <button class="tile big-btn c-simul reveal" type="button" id="reveal" hidden><span class="emoji" aria-hidden="true">👀</span><h3 data-t="reveal"></h3></button>

    <div id="details">
      <figure class="panel plot graph">
        <svg id="graph" viewBox="0 0 400 400" role="img"></svg>
        <figcaption class="legend" id="legend"></figcaption>
      </figure>

      <h2 class="section" data-t="howTitle"></h2>
      <div class="chips methods" id="methods" role="group" aria-label="Verfahren"></div>
      <div class="panel work-panel" id="work"></div>

      <div class="panel work-panel" id="check" hidden></div>
    </div>
  </section>

  <p class="version"><a href="../tests/">Tests</a> · <a href="https://github.com/littleGex/fordMath/blob/main/src/lib/linear-system.ts">Source</a></p>
</main>
</body>
</html>
