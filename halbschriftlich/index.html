<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>✂️ <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="chips levels" id="levels" role="group" aria-label="Stufe"></div>

  <section id="play" class="panel split-panel">
    <div class="quiz-top"><span class="dots-progress" id="progress"></span><span class="streak" id="count"></span></div>
    <p class="note" data-t="hint"></p>
    <div class="working" id="working"></div>
    <figure class="split-fig"><svg id="picture" role="img"></svg></figure>
    <button class="tile big-btn c-halb" type="button" id="check"><h3 data-t="check"></h3></button>
    <p class="message" id="message" hidden></p>
    <ol class="steps" id="steps" hidden></ol>
    <button class="tile big-btn c-halb" type="button" id="next" hidden><h3 id="next-label"></h3></button>
  </section>

  <section id="done" class="panel result-card" hidden>
    <p class="stars" id="stars"></p>
    <p class="score" id="score"></p>
    <button class="tile big-btn c-halb" type="button" id="again"><span class="emoji" aria-hidden="true">🔁</span><h3 data-t="again"></h3></button>
  </section>

  <p class="version"><a href="../tests/">Tests</a> · <a href="https://github.com/littleGex/fordMath/blob/main/src/lib/partly-written.ts">Source</a></p>
