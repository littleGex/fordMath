<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141c2e">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="fordMath">
<title>Heute üben · fordMath</title>
</head>
<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>🌞 <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="chips levels" role="group" aria-label="Stufe">
    <button class="chip" type="button" data-level="grundschule" aria-pressed="true" data-t="gs"></button>
    <button class="chip" type="button" data-level="sek1" aria-pressed="false" data-t="sek1"></button>
  </div>

  <div class="panel streak-card">
    <span class="flame" id="flame">🔥</span>
    <div>
      <p class="streak-days" id="streak-days"></p>
      <p class="note" id="streak-note"></p>
    </div>
  </div>

  <section class="panel quiz-panel" id="quiz"></section>

  <h2 class="section" data-t="progressTitle"></h2>
  <div class="panel topics" id="topics"></div>
  <p class="note reset-row">
    <button class="link-btn" type="button" id="reset" data-t="reset"></button>
    <span id="reset-confirm" hidden>
      <span data-t="resetSure"></span>
      <button class="link-btn danger" type="button" id="reset-yes" data-t="yes"></button>
      <button class="link-btn" type="button" id="reset-no" data-t="no"></button>
    </span>
  </p>

  <p class="version"><a href="../tests/">Tests</a> · <a href="https://github.com/littleGex/fordMath/blob/main/src/lib/daily.ts">Source</a></p>
</main>
<script type="module" src="/src/pages/heute.ts"></script>
</body>
</html>
