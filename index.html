<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="fordMath" />
    <meta name="theme-color" content="#2e43c4" />
    <title>fordMath</title>
  </head>
  <body>
    <main class="wrap">
      <header>
        <span class="eyebrow">fordMath</span>
        <h1>Number toolkit</h1>
        <p class="lede">Type some numbers and every method below updates as you go.</p>
      </header>

      <section class="input">
        <label for="values">Numbers</label>
        <textarea id="values" rows="2" inputmode="decimal" spellcheck="false">3, 1.5, 4, 1.5, 2, 4</textarea>
        <p class="hint">Separate with commas, spaces or semicolons. Use a dot for decimals (2.5, not 2,5).</p>
        <div class="chips">
          <button type="button" data-example="3, 1.5, 4, 1.5, 2, 4">Two modes</button>
          <button type="button" data-example="7, 2, 9, 4, 4">Odd count</button>
          <button type="button" data-example="0.25, 1.75, 3.5, -2">No mode</button>
          <button type="button" data-example="2, 3, 3, 4, 5, 40">Outlier</button>
        </div>
        <p class="error" id="error" hidden></p>
      </section>

      <section>
        <dl class="results" id="results"></dl>
        <p class="meta" id="meta"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
