<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141c2e">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="fordMath">
<title>Koordinaten · fordMath</title>
</head>
<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>📍 <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="chips ranges" role="group">
    <button class="chip" type="button" data-range="first" data-t="rangeFirst"></button>
    <button class="chip" type="button" data-range="all" data-t="rangeAll"></button>
  </div>

  <h2 class="section" data-t="drawTitle"></h2>
  <section class="panel draw-panel">
    <p class="note" id="rule"></p>
    <figure class="grid-fig"><svg id="draw"></svg></figure>
    <p class="walk" id="walk"></p>
    <div class="point-list" id="points"></div>
    <div class="row-btns">
      <button class="chip" type="button" id="join" aria-pressed="false" data-t="join"></button>
      <button class="chip" type="button" id="undo" data-t="undo"></button>
      <button class="chip" type="button" id="clear" data-t="clear"></button>
    </div>
  </section>

  <h2 class="section" data-t="seaTitle"></h2>
  <section class="panel sea-panel">
    <p class="note" data-t="seaHint"></p>
    <figure class="grid-fig"><svg id="sea"></svg></figure>
    <div class="aim">
      <div class="picker"><span>x</span><button type="button" class="chip" data-step="x,-1">−</button><b id="aim-x">0</b><button type="button" class="chip" data-step="x,1">+</button></div>
      <div class="picker"><span>y</span><button type="button" class="chip" data-step="y,-1">−</button><b id="aim-y">0</b><button type="button" class="chip" data-step="y,1">+</button></div>
    </div>
    <button class="tile big-btn c-coords" type="button" id="fire"><h3 id="fire-label"></h3></button>
    <p class="shot" id="shot" aria-live="polite"></p>
    <p class="note" id="fleet"></p>
    <button class="chip" type="button" id="new-game" data-t="newGame"></button>
  </section>

  <h2 class="section" data-t="quizTitle"></h2>
  <section class="panel quiz-panel" id="quiz"></section>

  <p class="version"><a href="https://github.com/littleGex/fordMath/blob/main/src/lib/coordinates.ts">Source</a></p>
</main>
<script type="module" src="/src/pages/koordinaten.ts"></script>
</body>
</html>
