<link rel="manifest" href="/fordMath/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="fordMath">

  <link rel="modulepreload" crossorigin href="/fordMath/assets/rational-rTKY84ys.js">

  <link rel="modulepreload" crossorigin href="/fordMath/assets/linear-system-nWh00aDE.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/linear-function-BbP_2fsz.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/coord-grid-C-2kx2eB.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/times-tables-CKGHodou.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/quiz-fjiUZjG6.js">

  <link rel="stylesheet" crossorigin href="/fordMath/assets/zone-DujYQsVA.css">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/lineare-funktionen-Dqhuj_9l.css">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/quiz-B91ond9q.css">
</head>
<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>📈 <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="panel explore-panel">
    <p class="equation" id="equation"></p>
    <div class="knobs">
      <div class="knob"><span class="k-m">m</span><button type="button" class="chip" data-knob="m,-1">−</button><input id="m" type="text" inputmode="decimal" autocomplete="off"><button type="button" class="chip" data-knob="m,1">+</button></div>
      <div class="knob"><span class="k-b">b</span><button type="button" class="chip" data-knob="b,-1">−</button><input id="b" type="text" inputmode="decimal" autocomplete="off"><button type="button" class="chip" data-knob="b,1">+</button></div>
    </div>
    <p class="error" id="error" hidden></p>
    <figure class="grid-fig"><svg id="explore"></svg></figure>
    <ul class="facts" id="facts"></ul>

    <div class="second">
      <button class="chip" type="button" id="second-toggle" aria-pressed="false" data-t="second"></button>
      <div class="knobs" id="second-knobs" hidden>
        <div class="knob"><span class="k-m2">m₂</span><button type="button" class="chip" data-knob="m2,-1">−</button><input id="m2" type="text" inputmode="decimal" autocomplete="off"><button type="button" class="chip" data-knob="m2,1">+</button></div>
        <div class="knob"><span class="k-m2">b₂</span><button type="button" class="chip" data-knob="b2,-1">−</button><input id="b2" type="text" inputmode="decimal" autocomplete="off"><button type="button" class="chip" data-knob="b2,1">+</button></div>
      </div>
      <ol class="steps" id="meet" hidden></ol>
    </div>

    <div class="probe">
      <span data-t="probe"></span>
      <span class="pp">P(<input id="px" type="text" inputmode="decimal" autocomplete="off" aria-label="x"><b class="sep" id="sep">|</b><input id="py" type="text" inputmode="decimal" autocomplete="off" aria-label="y">)</span>
    </div>
    <ol class="steps" id="probe-steps"></ol>
  </section>
  <div class="chips" id="examples"></div>

  <h2 class="section" data-t="twoTitle"></h2>
  <section class="panel two-panel">
    <p class="note" data-t="twoHint"></p>
    <figure class="grid-fig"><svg id="two"></svg></figure>
    <ol class="steps" id="two-steps"></ol>
  </section>

  <h2 class="section" data-t="quizTitle"></h2>
  <section class="panel quiz-panel" id="quiz"></section>

  <p class="version"><a href="https://github.com/littleGex/fordMath/blob/main/src/lib/linear-function.ts">Source</a></p>
</main>
</body>
</html>
