<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141c2e">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="fordMath">
<title>Negative Zahlen · fordMath</title>
</head>
<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>🌡️ <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="panel calc-panel">
    <div class="calc-row">
      <input id="a" type="text" inputmode="text" autocomplete="off" value="−4" aria-label="Start">
      <div class="chips op-chips" role="group">
        <button class="chip" type="button" data-op="+" aria-pressed="true">+</button>
        <button class="chip" type="button" data-op="-" aria-pressed="false">−</button>
      </div>
      <input id="b" type="text" inputmode="text" autocomplete="off" value="7" aria-label="Zahl">
    </div>
    <p class="error" id="calc-error" hidden></p>
    <p class="story" id="story" hidden></p>
    <div class="calc-body">
      <svg id="thermo" class="thermo" role="img"></svg>
      <div class="calc-text">
        <p class="calc-result" id="calc-result"></p>
        <ol class="steps" id="calc-steps"></ol>
      </div>
    </div>
  </section>
  <div class="chips" id="stories"></div>

  <h2 class="section" data-t="rulesTitle"></h2>
  <div class="panel rules-panel">
    <ul class="rules-list" id="rules"></ul>
  </div>

  <h2 class="section" data-t="compareTitle"></h2>
  <section class="panel cmp-panel">
    <div class="calc-row">
      <input id="cmp-a" type="text" inputmode="text" autocomplete="off" value="−7" aria-label="1">
      <span class="cmp-sign" id="cmp-sign">?</span>
      <input id="cmp-b" type="text" inputmode="text" autocomplete="off" value="−3" aria-label="2">
    </div>
    <ol class="steps" id="cmp-steps"></ol>
    <p class="note" id="opp"></p>
  </section>

  <h2 class="section" data-t="quizTitle"></h2>
  <section class="panel quiz-panel" id="quiz"></section>

  <p class="version"><a href="../tests/">Tests</a> · <a href="https://github.com/littleGex/fordMath/blob/main/src/lib/integers.ts">Source</a></p>
</main>
<script type="module" src="/src/pages/negative-zahlen.ts"></script>
</body>
</html>
