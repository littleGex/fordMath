<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>🧩 <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="chips modes" role="group" aria-label="Modus">
    <button class="chip" type="button" data-mode="steps" aria-pressed="true" data-t="modeSteps"></button>
    <button class="chip" type="button" data-mode="brackets" aria-pressed="false" data-t="modeBrackets"></button>
  </div>
  <div class="chips levels" id="levels" role="group" aria-label="Stufe"></div>

  <ol class="panel rules" id="rules"></ol>

  <section id="play">
    <div class="panel play-panel">
      <div class="quiz-top">
        <div class="dots-progress" id="dots"></div>
        <span class="streak" id="count"></span>
      </div>

      <div id="steps-play" class="steps-play">
        <p class="note" id="hint"></p>
        <div class="working" id="working" aria-live="polite"></div>
        <div class="ask" id="ask" hidden>
          <span class="ask-q" id="ask-q"></span><span class="ask-a" id="ask-a">?</span>
        </div>
      </div>

      <div id="brackets-play" class="brackets-play" hidden>
        <p class="quiz-q" id="b-prompt"></p>
        <p class="b-target"><span data-t="target"></span> <b id="b-target"></b></p>
        <div class="quiz-choices" id="b-choices"></div>
        <ol class="steps" id="b-steps" hidden></ol>
      </div>

      <p class="message" id="message" aria-live="polite" hidden></p>
      <button class="tile big-btn c-order next" type="button" id="next" hidden><h3 id="next-label"></h3></button>
    </div>

    <div class="keypad" id="keypad" hidden>
      <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
      <button type="button" data-key="del" aria-label="Löschen">⌫</button><button type="button" data-key="0">0</button><button type="button" data-key="ok" class="ok">OK</button>
    </div>
  </section>

  <section id="done" hidden>
    <div class="panel result-card">
      <p class="stars" id="stars"></p>
      <p class="praise" id="praise"></p>
      <p class="score" id="score"></p>
    </div>
    <button class="tile big-btn c-order again" type="button" id="again"><span class="emoji" aria-hidden="true">🔁</span><h3 data-t="again"></h3></button>
  </section>

  <p class="version"><a href="../tests/">Tests</a> · <a href="https://github.com/littleGex/fordMath/blob/main/src/lib/expression/steps.ts">Source</a></p>
</main>
</body>
</html>
