<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141c2e">
<link rel="icon" type="image/svg+xml" href="/fordMath/favicon.svg">
<link rel="apple-touch-icon" href="/fordMath/icons/apple-touch-icon.png">
<link rel="manifest" href="/fordMath/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="fordMath">
<title>Quader und Würfelnetze · fordMath</title>
  <script type="module" crossorigin src="/fordMath/assets/quader-Bs_qnNEu.js"></script>
  <link rel="modulepreload" crossorigin href="/fordMath/assets/zone-2S0LliKN.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/random-BYFHwryz.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/times-tables-CKGHodou.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/quiz-fjiUZjG6.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/area-CeVYCO2P.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/cuboid-BhczdIYk.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/lang-dy_RFBaf.js">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/zone-DujYQsVA.css">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/quader-VmXx0cU0.css">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/quiz-B91ond9q.css">
</head>
<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>🧊 <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="panel cuboid-panel">
    <div class="steppers" id="steppers"></div>
    <svg id="cuboid" class="cuboid" viewBox="0 0 320 240" role="img"></svg>
    <div class="readout">
      <div class="tile result c-cuboid"><span class="sym">V</span><h3 data-t="volume"></h3><span class="value" id="v"></span></div>
      <div class="tile result c-cuboid"><span class="sym">O</span><h3 data-t="surface"></h3><span class="value" id="o"></span></div>
    </div>
    <ol class="steps" id="v-steps"></ol>
    <ol class="steps" id="o-steps"></ol>
  </section>

  <h2 class="section" data-t="unitsTitle"></h2>
  <div class="panel units" id="units"></div>

  <h2 class="section" data-t="netTitle"></h2>
  <section class="panel net-panel">
    <p class="note" data-t="netHint"></p>
    <svg id="net" class="net" role="img"></svg>
    <p class="net-status" id="net-status"></p>
    <div class="chips net-chips">
      <button class="chip" type="button" id="net-cross" data-t="netCross"></button>
      <button class="chip" type="button" id="net-clear" data-t="clear"></button>
      <button class="chip" type="button" id="net-all" data-t="netAll"></button>
    </div>
    <div class="gallery" id="gallery" hidden></div>
  </section>

  <h2 class="section" data-t="quizTitle"></h2>
  <section class="panel quiz-panel" id="quiz"></section>

  <p class="version"><a href="../tests/">Tests</a> · <a href="https://github.com/littleGex/fordMath/blob/main/src/lib/cuboid.ts">Source</a></p>
</main>
</body>
</html>
