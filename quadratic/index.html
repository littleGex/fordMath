<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141c2e">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="fordMath">
<title>Quadratics · fordMath</title>
</head>
<body>
<main class="narrow">
  <header>
    <a class="back" href="../">← fordMath</a>
    <h1>🎢 Quadratics</h1>
    <p class="subtitle">Solve ax² + bx + c = 0 and see the curve</p>
  </header>

  <section class="panel coef-panel">
    <p class="equation" id="equation" aria-live="polite">x² − 5x + 6 = 0</p>
    <div class="coefs">
      <div class="coef">
        <label for="coef-a">a</label>
        <div class="row">
          <input id="coef-a" type="text" inputmode="decimal" autocomplete="off" value="1">
          <button class="flip" type="button" data-flip="a" aria-label="Flip the sign of a">±</button>
        </div>
      </div>
      <div class="coef">
        <label for="coef-b">b</label>
        <div class="row">
          <input id="coef-b" type="text" inputmode="decimal" autocomplete="off" value="-5">
          <button class="flip" type="button" data-flip="b" aria-label="Flip the sign of b">±</button>
        </div>
      </div>
      <div class="coef">
        <label for="coef-c">c</label>
        <div class="row">
          <input id="coef-c" type="text" inputmode="decimal" autocomplete="off" value="6">
          <button class="flip" type="button" data-flip="c" aria-label="Flip the sign of c">±</button>
        </div>
      </div>
    </div>
    <p class="note">Use ± to make a number negative. Decimals can use a dot or a comma.</p>
    <p class="error" id="error" hidden></p>
  </section>

  <div class="chips" role="group" aria-label="Example equations">
    <button class="chip" type="button" data-abc="1,-5,6">Two roots</button>
    <button class="chip" type="button" data-abc="1,-2,1">One root</button>
    <button class="chip" type="button" data-abc="1,2,5">No real roots</button>
    <button class="chip" type="button" data-abc="-2,4,6">Opens down</button>
    <button class="chip" type="button" data-abc="0.5,-1.5,1">Decimals</button>
    <button class="chip" type="button" data-abc="0,2,-4">Not a quadratic</button>
    <button class="chip" type="button" data-abc="1,100000000,1">Tricky</button>
  </div>

  <div class="qresults">
    <div class="tile result c-quadratic wide"><span class="sym">x</span><h3>Roots</h3><span class="value" id="out-roots">–</span></div>
    <div class="tile result c-sd"><span class="sym">D</span><h3>Discriminant</h3><span class="value" id="out-d">–</span><p class="desc" id="out-d-note"></p></div>
    <div class="tile result c-stats"><span class="sym">(h, k)</span><h3>Vertex</h3><span class="value" id="out-vertex">–</span><p class="desc" id="out-vertex-note"></p></div>
  </div>

  <figure class="panel plot">
    <svg id="plot" viewBox="0 0 600 380" role="img" aria-label="Graph of the equation with its roots and vertex marked"></svg>
    <figcaption class="legend">
      <span><i class="k-curve"></i>y = ax² + bx + c</span>
      <span><i class="k-root"></i>roots (where y = 0)</span>
      <span><i class="k-vertex"></i>vertex</span>
    </figcaption>
  </figure>

  <h2 class="section">How it's worked out</h2>
  <div id="explain" class="explain"></div>

  <p class="version"><a href="../tests/">See the tests</a> · <a href="https://github.com/littleGex/fordMath/blob/main/src/lib/quadratic.ts">Source</a></p>
</main>
<script type="module" src="/src/pages/quadratic.ts"></script>
</body>
</html>
