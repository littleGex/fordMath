<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>📖 <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="chips levels" role="group" aria-label="Stufe">
    <button class="chip" type="button" data-level="grundschule" aria-pressed="true" data-t="gs"></button>
    <button class="chip" type="button" data-level="sek1" aria-pressed="false" data-t="sek1"></button>
  </div>

  <section id="play">
    <div class="play-top">
      <div class="dots-progress" id="progress" aria-hidden="true"></div>
      <ol class="stepper" id="stepper"></ol>
    </div>

    <div class="panel story" id="story" aria-live="polite"></div>

    <div class="panel task" id="task">
      <h2 class="task-title" id="task-title"></h2>
      <div class="options" id="options"></div>
      <div class="result-row" id="result-row" hidden>
        <span class="calc-shown" id="calc-shown"></span>
        <span>=</span>
        <input id="result" type="text" inputmode="decimal" autocomplete="off" aria-label="Ergebnis">
        <span class="unit" id="unit"></span>
      </div>
      <button class="tile big-btn c-word check" type="button" id="check" hidden><h3 data-t="check"></h3></button>
      <p class="message" id="message" hidden></p>
    </div>

    <div class="panel solution" id="solution" hidden>
      <h2 class="task-title" data-t="solutionTitle"></h2>
      <ol class="steps" id="solution-steps"></ol>
      <button class="tile big-btn c-word" type="button" id="next"><h3 id="next-label"></h3></button>
    </div>
  </section>

  <section id="done" hidden>
    <div class="panel result-card">
      <p class="stars" id="stars"></p>
      <p class="praise" id="praise"></p>
      <p class="score" id="score"></p>
    </div>
    <button class="tile big-btn c-word again" type="button" id="again"><span class="emoji" aria-hidden="true">🔁</span><h3 data-t="again"></h3></button>
  </section>

  <p class="version"><a href="../tests/">Tests</a> · <a href="https://github.com/littleGex/fordMath/blob/main/src/lib/word-problems.ts">Source</a></p>
