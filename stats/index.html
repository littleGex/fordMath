<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141c2e">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="fordMath">
<title>Statistics · fordMath</title>
</head>
<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>📊 <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="panel input">
    <label for="values" data-t="numbers"></label>
    <textarea id="values" rows="2" spellcheck="false">2, 4, 4, 4, 5, 5, 7, 9</textarea>
    <p class="note" data-t="inputNote"></p>
    <p class="error" id="error" hidden></p>
  </section>

  <div class="chips" role="group" id="examples">
  </div>

  <div class="results" id="results"></div>
  <p class="note" id="meta"></p>

  <figure class="panel plot">
    <svg id="plot" viewBox="0 0 600 200" role="img" data-t-label="plotLabel"></svg>
    <figcaption class="legend">
      <span><i class="k-mean"></i><span data-t="kMean"></span></span>
      <span><i class="k-median"></i><span data-t="kMedian"></span></span>
      <span><i class="k-band"></i><span data-t="kBand"></span></span>
      <span><i class="k-mode"></i><span data-t="kMode"></span></span>
    </figcaption>
  </figure>

  <h2 class="section" id="quartiles" data-t="quartilesTitle"></h2>
  <div class="chips q-methods" role="group">
    <button class="chip" type="button" data-method="halves" aria-pressed="true" data-t="mHalves"></button>
    <button class="chip" type="button" data-method="linear" aria-pressed="false" data-t="mLinear"></button>
  </div>
  <p class="note method-note" id="method-note"></p>
  <div class="results" id="q-results"></div>
  <div class="panel strip-panel">
    <p class="note" data-t="stripNote"></p>
    <div class="strip" id="strip"></div>
  </div>
  <figure class="panel plot">
    <svg id="boxplot" viewBox="0 0 600 150" role="img" data-t-label="boxLabel"></svg>
    <figcaption class="legend">
      <span><i class="k-box"></i><span data-t="kBox"></span></span>
      <span><i class="k-median"></i><span data-t="kMedian"></span></span>
      <span><i class="k-out"></i><span data-t="kOut"></span></span>
    </figcaption>
  </figure>

  <h2 class="section" data-t="howTitle"></h2>
  <div id="explain" class="explain"></div>

  <p class="version"><a href="https://github.com/littleGex/fordMath/tree/main/src/lib">Source</a></p>
</main>
<script type="module" src="/src/pages/stats.ts"></script>
</body>
</html>
