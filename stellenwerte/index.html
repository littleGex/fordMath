<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141c2e">
<link rel="icon" type="image/svg+xml" href="/fordMath/favicon.svg">
<link rel="apple-touch-icon" href="/fordMath/icons/apple-touch-icon.png">
<link rel="manifest" href="/fordMath/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="fordMath">
<title>Stellenwerte · fordMath</title>
  <script type="module" crossorigin src="/fordMath/assets/stellenwerte-BIqL4vjr.js"></script>
  <link rel="modulepreload" crossorigin href="/fordMath/assets/zone-2S0LliKN.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/random-BYFHwryz.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/times-tables-CKGHodou.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/quiz-fjiUZjG6.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/place-value-Cxkd0A9A.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/lang-dy_RFBaf.js">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/zone-DujYQsVA.css">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/stellenwerte-v9D6vuB2.css">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/quiz-B91ond9q.css">
</head>
<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>🔟 <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="panel number-panel">
    <div class="chips level-chips" role="group" id="levels">
      <button class="chip" type="button" data-level="1000"></button>
      <button class="chip" type="button" data-level="1000000"></button>
      <button class="chip" type="button" data-level="1000000000"></button>
    </div>
    <div class="number-row">
      <input id="number" type="text" inputmode="numeric" autocomplete="off" aria-label="Zahl">
      <button class="tile big-btn c-place dice" type="button" id="random"><h3 data-t="random"></h3></button>
    </div>
    <p class="error" id="error" hidden></p>
  </section>

  <div id="content">
    <h2 class="section" data-t="tableTitle"></h2>
    <section class="panel table-panel">
      <div class="pv-scroll"><div class="pv-table" id="pv-table"></div></div>
      <p class="split" id="split-places"></p>
      <p class="split values" id="split-values"></p>
      <p class="in-words"><span class="label" data-t="inWords"></span> <span id="words"></span></p>
    </section>

    <h2 class="section" data-t="roundTitle"></h2>
    <section class="panel round-panel">
      <div class="chips round-chips" role="group" id="round-places"></div>
      <figure class="nl"><svg id="round-line" viewBox="0 0 600 130" role="img"></svg></figure>
      <ol class="steps" id="round-steps"></ol>
    </section>

    <h2 class="section" data-t="quizTitle"></h2>
    <section class="panel quiz-panel" id="quiz"></section>
  </div>

  <p class="version"><a href="../tests/">Tests</a> · <a href="https://github.com/littleGex/fordMath/blob/main/src/lib/place-value.ts">Source</a></p>
</main>
</body>
</html>
