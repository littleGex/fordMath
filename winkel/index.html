<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141c2e">
<link rel="icon" type="image/svg+xml" href="/fordMath/favicon.svg">
<link rel="apple-touch-icon" href="/fordMath/icons/apple-touch-icon.png">
<link rel="manifest" href="/fordMath/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="fordMath">
<title>Winkel · fordMath</title>
  <script type="module" crossorigin src="/fordMath/assets/winkel-B-IqVbaU.js"></script>
  <link rel="modulepreload" crossorigin href="/fordMath/assets/zone-2S0LliKN.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/random-BYFHwryz.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/times-tables-CKGHodou.js">
  <link rel="modulepreload" crossorigin href="/fordMath/assets/lang-dy_RFBaf.js">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/zone-DujYQsVA.css">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/winkel-DHUiIxD6.css">
  <link rel="stylesheet" crossorigin href="/fordMath/assets/quiz-B91ond9q.css">
</head>
<body>
<main class="narrow">
  <header class="kid-head">
    <div>
      <a class="back" href="../">← fordMath</a>
      <h1>📐 <span data-t="title"></span></h1>
      <p class="subtitle" data-t="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button class="chip" type="button" data-lang="de" aria-pressed="true">DE</button>
      <button class="chip" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="panel quiz-panel angle-panel" id="play">
    <div class="quiz-top"><span class="dots-progress" id="progress"></span><span class="streak" id="streak"></span></div>
    <p class="quiz-q" id="prompt" aria-live="polite"></p>
    <svg id="board" class="board" viewBox="0 0 360 300" role="img"></svg>
    <p class="note geo-hint" id="geo-hint" hidden></p>
    <div class="quiz-choices" id="choices"></div>
    <div class="measure-row" id="measure-row" hidden>
      <input id="degrees" type="text" inputmode="numeric" autocomplete="off" aria-label="Grad">
      <span class="deg">°</span>
      <button class="chip" type="button" id="help" data-t="help"></button>
    </div>
    <button class="tile big-btn c-angle" type="button" id="check" hidden><h3 data-t="check"></h3></button>
    <div id="feedback" hidden>
      <p class="verdict" id="verdict"></p>
      <ol class="steps" id="steps"></ol>
      <button class="tile big-btn c-angle" type="button" id="next"><h3 id="next-label"></h3></button>
    </div>
  </section>

  <section class="panel quiz-panel" id="done" hidden>
    <p class="stars" id="stars"></p>
    <p class="score" id="score"></p>
    <button class="tile big-btn c-angle" type="button" id="again"><span class="emoji" aria-hidden="true">🔁</span><h3 data-t="again"></h3></button>
  </section>

  <h2 class="section" data-t="kindsTitle"></h2>
  <div class="panel kinds" id="kinds"></div>

  <p class="version"><a href="../tests/">Tests</a> · <a href="https://github.com/littleGex/fordMath/blob/main/src/lib/angles.ts">Source</a></p>
</main>
</body>
</html>
